[package]
name = "gamedoro"
version = "0.1.0"
edition = "2021"
description = "Pomodoro ultraleve para Waybar com as trilhas de Minecraft, The Witcher 3 e The Last of Us"
license = "MIT"

[dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "vorbis", "mp3", "flac"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
